<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Health Dashboard</title>
    <meta name="description" content="Live nutrition, sleep and activity from MyFitnessPal, Oura Ring and Garmin." />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="top">
        <div>
          <h1>Health dashboard</h1>
          <p class="sub"><span class="live-dot" aria-hidden="true"></span><span id="live-text">Connecting…</span><span id="notice" class="notice" role="status" hidden></span></p>
        </div>
        <div class="controls" role="group" aria-label="Dashboard controls">
          <button id="sync" type="button" class="btn">Sync now</button>
          <button id="goals-toggle" type="button" class="btn btn-ghost" aria-expanded="false" aria-controls="goals-panel">Goals</button>
          <label class="btn btn-ghost" title="Import a MyFitnessPal nutrition CSV export">
            Import MFP CSV
            <input id="mfp-file" type="file" accept=".csv,text/csv" hidden />
          </label>
        </div>
      </header>

      <section id="goals-panel" class="card goals-panel" hidden aria-label="Your goals">
        <form id="goals-form">
          <div class="card-head">
            <div>
              <h2>Your goals</h2>
              <div class="muted small">Every view measures you against these.</div>
            </div>
          </div>
          <div class="goals-fields">
            <label>Sleep (hours)<input id="g-sleep" name="sleepHours" type="number" min="3" max="12" step="0.25" required /></label>
            <label>Bedtime<input id="g-bedtime" name="bedtime" type="time" required /></label>
            <label>Steps<input id="g-steps" name="steps" type="number" min="500" max="50000" step="500" required /></label>
            <label>Protein (g)<input id="g-protein" name="protein" type="number" min="10" max="400" step="5" required /></label>
            <label>Fibre (g)<input id="g-fiber" name="fiber" type="number" min="5" max="100" step="1" required /></label>
            <label>Days a week per goal<input id="g-days" name="daysPerWeek" type="number" min="1" max="7" step="1" required /><span class="hint">The rest are spare days. 5 of 7 is a good start</span></label>
            <label>Calories (kcal)<input id="g-calories" name="calories" type="number" min="800" max="6000" step="50" required /><span class="hint">Your MyFitnessPal goal is used for any day that has one</span></label>
            <label>Calorie range (±%)<input id="g-tol" name="tol" type="number" min="2" max="30" step="1" required /></label>
            <label>Intensity minutes / week<input id="g-intensity" name="intensity" type="number" min="0" max="1500" step="10" required /></label>
            <label class="check"><input id="g-show-cal" name="showCalories" type="checkbox" /> Show calories<span class="hint">Turn off to track protein and fibre without calorie numbers</span></label>
          </div>
          <div class="goals-actions">
            <button type="submit" class="btn btn-primary">Save goals</button>
            <button type="button" id="goals-cancel" class="btn btn-ghost">Cancel</button>
          </div>
        </form>
      </section>

      <section id="sources" class="sources" aria-label="Data sources"></section>

      <div class="toolbar">
        <nav class="tabs" role="tablist" aria-label="Views">
          <button role="tab" id="tab-today" aria-controls="panel-today" type="button">Today</button>
          <button role="tab" id="tab-habits" aria-controls="panel-habits" type="button">Habits</button>
          <button role="tab" id="tab-insights" aria-controls="panel-insights" type="button">Insights</button>
          <button role="tab" id="tab-trends" aria-controls="panel-trends" type="button">Trends</button>
        </nav>
        <label class="select" id="range-wrap">
          <span class="visually-hidden">Date range</span>
          <select id="range">
            <option value="7">Last 7 days</option>
            <option value="30" selected>Last 30 days</option>
            <option value="90">Last 90 days</option>
            <option value="365">Last year</option>
          </select>
        </label>
        <span id="scope-note" class="muted small"></span>
      </div>

      <main id="main">
        <section id="panel-today" role="tabpanel" aria-labelledby="tab-today"></section>
        <section id="panel-habits" role="tabpanel" aria-labelledby="tab-habits" hidden></section>
        <section id="panel-insights" role="tabpanel" aria-labelledby="tab-insights" hidden></section>
        <section id="panel-trends" role="tabpanel" aria-labelledby="tab-trends" hidden></section>
      </main>
    </div>
    <div id="tooltip" class="tooltip" role="status" aria-live="polite" hidden></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
