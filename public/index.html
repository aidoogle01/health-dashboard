<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Health Dashboard</title>
    <meta name="description" content="Live nutrition, sleep and activity from MyFitnessPal, Oura Ring and Garmin." />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="top">
        <div>
          <h1>Health dashboard</h1>
          <p class="sub"><span class="live-dot" aria-hidden="true"></span><span id="live-text">Connecting…</span><span id="notice" class="notice" role="status" hidden></span></p>
        </div>
        <div class="controls" role="group" aria-label="Dashboard controls">
          <label class="select">
            <span class="visually-hidden">Date range</span>
            <select id="range">
              <option value="7">Last 7 days</option>
              <option value="14">Last 14 days</option>
              <option value="30" selected>Last 30 days</option>
              <option value="90">Last 90 days</option>
            </select>
          </label>
          <button id="sync" type="button" class="btn">Sync now</button>
          <label class="btn btn-ghost" title="Import a MyFitnessPal nutrition CSV export">
            Import MFP CSV
            <input id="mfp-file" type="file" accept=".csv,text/csv" hidden />
          </label>
        </div>
      </header>

      <section id="sources" class="sources" aria-label="Data sources"></section>

      <main id="main">
        <section id="tiles" class="tiles" aria-label="Today"></section>

        <section class="grid" id="charts"></section>

        <section class="card">
          <div class="card-head">
            <h2>Recent activities</h2>
            <span class="muted small">Garmin</span>
          </div>
          <div class="table-wrap">
            <table class="data" id="activities">
              <thead>
                <tr><th>Date</th><th>Activity</th><th class="num">Duration</th><th class="num">Distance</th><th class="num">Calories</th><th class="num">Avg HR</th></tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <div id="tooltip" class="tooltip" role="status" aria-live="polite" hidden></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
